function summary(){let tot=G.t.club.length+G.t.intl.length+G.t.pers.length,pk=Math.max(G.ovr,...G.h.map(h=>h.o1)),bg=Math.max(0,...G.h.map(h=>h.g));
return `<div class="c hero"><div class="hi"><b>${G.name}</b><div class="mu">${fl(G.cc)} ${cname(G.cc)} · ${G.pos} · #${G.num} · ${G.over?'Retired':'Active'}</div></div><div class="ring" style="--p:${pk}"><div><b>${pk}</b><small>PEAK</small></div></div></div>
<h2>📈 Career totals</h2><div class="g">${stt('📅',G.h.length,'Seasons')}${stt('🏟️',G.c.app,'Apps')}${stt('⚽',G.c.g,'Goals')}${stt('🅰️',G.c.a,'Assists')}${stt('🌍',G.c.caps,'Caps')}${stt('🏆',tot,'Trophies')}${stt('🔥',bg,'Best goals')}${stt('🔁',G.c.clubs.length,'Clubs')}</div>
<h2>🏆 Trophy cabinet</h2><div class="g3">${cab('club','Club trophies','🛡️')}${cab('intl','International trophies','🌍')}${cab('pers','Personal awards','⭐')}</div>
<h2>🛡️ Clubs</h2>${spells().map(x=>`<div class="c sp">${crest(x.club,34)}<div><b>${x.club}</b><div class="mu">S${x.from}${x.to>x.from?'–S'+x.to:''} · ${x.app} apps · ${x.g} goals · ${x.a} assists</div></div></div>`).join('')||'<div class="c mu">No clubs yet.</div>'}
<h2>📅 Season history</h2>${G.h.length?G.h.map(h=>`<div class="c hc"><div><b>Season ${h.s}</b> · Age ${h.age}<div class="mu">${h.club}</div></div><div class="ov">${h.o1}<small class="${h.o1>=h.o0?'up':'dn'}">${h.o1>=h.o0?'▲':'▼'}${Math.abs(h.o1-h.o0)}</small></div><div class="mu hs">${h.app} apps · ${h.g} goals · ${h.a} assists</div><div class="chips">${evc(h.ev,h.x)}</div></div>`).join(''):'<div class="c mu">Sim your first season to start your history.</div>'}`}
const stag=r=>r.querySelectorAll('.c,.oc,.st,.tr').forEach((e,i)=>e.style.setProperty('--i',Math.min(i,16)));
function shell(){$('app').innerHTML=`<div class="nav"><button id="n_home" onclick="setTab('home')">🏠 Career</button><button id="n_sum" onclick="setTab('sum')">📊 Summary</button></div><div class="tog"><span>🔒 Stay at current club</span><label class="sw"><input type="checkbox" id="stay" onchange="G.stay=this.checked"><i></i></label></div><div id="view"></div>`;$('stay').checked=!!G.stay}
function setTab(k){G.tab=k;render()}
function render(){if(!$('view'))shell();let t=G.tab;$('n_home').className=t=='home'?'':'s';$('n_sum').className=t=='sum'?'':'s';$('view').innerHTML=t=='sum'?summary():home();stag($('view'))}
(function(){if(typeof innerWidth==='undefined')return;const sv=document.getElementById('sf'),N='http://www.w3.org/2000/svg';
function build(){sv.innerHTML='';const W=innerWidth,Hh=innerHeight;sv.setAttribute('viewBox','0 0 '+W+' '+Hh);
for(let i=0;i<170;i++){const op=Math.random()*.4+.06,c=document.createElementNS(N,'circle');c.setAttribute('cx',Math.random()*W);c.setAttribute('cy',Math.random()*Hh);c.setAttribute('r',Math.random()+.15);c.setAttribute('fill','#fff');c.setAttribute('opacity',op);
const a=document.createElementNS(N,'animate');a.setAttribute('attributeName','opacity');a.setAttribute('values',op+';'+(op*.12).toFixed(3)+';'+op);a.setAttribute('dur',(Math.random()*5+2).toFixed(1)+'s');a.setAttribute('begin',(Math.random()*8).toFixed(1)+'s');a.setAttribute('repeatCount','indefinite');c.appendChild(a);sv.appendChild(c)}}
build();addEventListener('resize',build)})();
setup();
</script></body></html>
