<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #222;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #111;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #a0d468;
        }

        .screen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 2.5rem;
            color: #ffce54;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0px #d43f3a;
            line-height: 0.95;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #4fc1e9;
        }

        .btn {
            background: #4fc1e9;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 0;
            width: 80%;
            max-width: 250px;
            box-shadow: 0 5px 0 #3bafda;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .btn-danger {
            background: #da4453;
            box-shadow: 0 5px 0 #b23b47;
        }

        .char-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .char-card {
            background: #333;
            border: 4px solid #555;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            width: 80px;
            text-align: center;
        }

        .char-card.selected {
            border-color: #ffce54;
            background: #444;
        }

        .char-preview {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .setting-row {
            margin: 20px 0;
            font-size: 1.2rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 280px;
            gap: 12px;
        }

        select {
            padding: 10px;
            font-size: 1rem;
            border-radius: 5px;
            font-weight: bold;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0px #000;
            z-index: 5;
            pointer-events: none;
        }

        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 10px;
            z-index: 5;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            color: white;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud" class="hidden">SCORE: <span id="score-val">0</span></div>

    <div id="menu-screen" class="screen">
        <h1>CROSSY<br>STREETS</h1>
        <button class="btn" onclick="startGame()">START GAME</button>
        <button class="btn" onclick="showScreen('char-screen')">CHARACTERS</button>
        <button class="btn" onclick="showScreen('settings-screen')">SETTINGS</button>
    </div>

    <div id="char-screen" class="screen hidden">
        <h2>CHOOSE CHARACTER</h2>
        <div class="char-grid">
            <div class="char-card selected" onclick="selectChar('🐱', this)">
                <div class="char-preview">🐱</div>
                <div style="font-size:0.7rem">CAT</div>
            </div>
            <div class="char-card" onclick="selectChar('🐸', this)">
                <div class="char-preview">🐸</div>
                <div style="font-size:0.7rem">FROG</div>
            </div>
            <div class="char-card" onclick="selectChar('🤖', this)">
                <div class="char-preview">🤖</div>
                <div style="font-size:0.7rem">ROBOT</div>
            </div>
        </div>
        <button class="btn btn-danger" onclick="showScreen('menu-screen')">BACK</button>
    </div>

    <div id="settings-screen" class="screen hidden">
        <h2>SETTINGS</h2>
        <div class="setting-row">
            <label for="difficulty-setting">DIFFICULTY:</label>
            <select id="difficulty-setting" onchange="updateSettings()">
                <option value="1">EASY</option>
                <option value="1.5" selected>NORMAL</option>
                <option value="2.2">HARD</option>
            </select>
        </div>
        <button class="btn btn-danger" onclick="showScreen('menu-screen')">BACK</button>
    </div>

    <div id="gameover-screen" class="screen hidden">
        <h1 style="color:#da4453">GAME OVER</h1>
        <h2 style="color:white">FINAL SCORE: <span id="final-score">0</span></h2>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        <button class="btn btn-danger" onclick="showScreen('menu-screen')">MAIN MENU</button>
    </div>

    <div id="mobile-controls" class="hidden">
        <div id="btn-up" class="touch-btn">▲</div>
        <div id="btn-left" class="touch-btn">◀</div>
        <div id="btn-down" class="touch-btn">▼</div>
        <div id="btn-right" class="touch-btn">▶</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameSpeedMultiplier = 1.5;
    let selectedEmoji = '🐱';
    let gameActive = false;
    let score = 0;
    let maxRowReached = 0;

    const gridX = 9;
    const gridY = 14;
    let stepX = 1, stepY = 1;

    let player = { x: 4, y: 13 };
    let lanes = [];

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        stepX = canvas.width / gridX;
        stepY = canvas.height / gridY;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
        if (screenId === 'menu-screen') {
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('mobile-controls').classList.add('hidden');
            gameActive = false;
        }
    }

    function selectChar(emoji, element) {
        selectedEmoji = emoji;
        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
        element.classList.add('selected');
    }

    function updateSettings() {
        gameSpeedMultiplier = parseFloat(document.getElementById('difficulty-setting').value);
    }

    class Lane {
        constructor(index, type) {
            this.index = index;
            this.type = type;
            this.color = type === 'grass' ? '#8cc152' : '#434a54';
            this.obstacles = [];

            if (type === 'road') {
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.speed = (Math.random() * 1.5 + 1) * gameSpeedMultiplier * this.direction;

                let count = Math.floor(Math.random() * 2) + 2;
                for (let i = 0; i < count; i++) {
                    this.obstacles.push({
                        x: (canvas.width / count) * i + (Math.random() * 30),
                        width: stepX * (Math.random() * 0.8 + 1.2),
                        color: ['#e67e22', '#e74c3c', '#9b59b6', '#f1c40f', '#3498db'][Math.floor(Math.random() * 5)]
                    });
                }
            }
        }

        update() {
            if (this.type !== 'road') return;
            this.obstacles.forEach(obs => {
                obs.x += this.speed;
                if (this.speed > 0 && obs.x > canvas.width) obs.x = -obs.width;
                if (this.speed < 0 && obs.x < -obs.width) obs.x = canvas.width;
            });
        }

        draw(yPos) {
            ctx.fillStyle = this.color;
            ctx.fillRect(0, yPos, canvas.width, stepY);

            if (this.type === 'road') {
                ctx.strokeStyle = "rgba(255,255,255,0.15)";
                ctx.setLineDash([10, 20]);
                ctx.beginPath();
                ctx.moveTo(0, yPos + stepY / 2);
                ctx.lineTo(canvas.width, yPos + stepY / 2);
                ctx.stroke();
                ctx.setLineDash([]);

                this.obstacles.forEach(obs => {
                    ctx.fillStyle = obs.color;
                    ctx.fillRect(obs.x, yPos + 4, obs.width, stepY - 8);

                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    if (this.speed > 0) {
                        ctx.fillRect(obs.x + obs.width - 20, yPos + 8, 12, stepY - 16);
                    } else {
                        ctx.fillRect(obs.x + 8, yPos + 8, 12, stepY - 16);
                    }
                });
            }
        }
    }

    function initLanes() {
        lanes = [];
        lanes.push(new Lane(0, 'grass'));
        for (let i = 1; i < 30; i++) {
            let type = Math.random() > 0.45 ? 'road' : 'grass';
            if (i >= 2 && lanes[i - 1].type === 'grass' && lanes[i - 2].type === 'grass') type = 'road';
            lanes.push(new Lane(i, type));
        }
    }

    function startGame() {
        score = 0;
        maxRowReached = 0;
        player = { x: 4, y: 13 };
        document.getElementById('score-val').innerText = score;
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('hud').classList.remove('hidden');

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('mobile-controls').classList.remove('hidden');
        }

        initLanes();
        gameActive = true;
        requestAnimationFrame(animate);
    }

    function movePlayer(dir) {
        if (!gameActive) return;

        if (dir === 'up') {
            player.y--;
            if (lanes.length - (13 - player.y) < 15) {
                let type = Math.random() > 0.5 ? 'road' : 'grass';
                lanes.push(new Lane(lanes.length, type));
            }
        }
        if (dir === 'down' && player.y < 13) player.y++;
        if (dir === 'left' && player.x > 0) player.x--;
        if (dir === 'right' && player.x < gridX - 1) player.x++;

        let calculatedScore = 13 - player.y;
        if (calculatedScore > maxRowReached) {
            maxRowReached = calculatedScore;
            score = maxRowReached;
            document.getElementById('score-val').innerText = score;
        }
    }

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp' || e.key === 'w') movePlayer('up');
        if (e.key === 'ArrowDown' || e.key === 's') movePlayer('down');
        if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer('left');
        if (e.key === 'ArrowRight' || e.key === 'd') movePlayer('right');
    });

    document.getElementById('btn-up').addEventListener('touchstart', e => { e.preventDefault(); movePlayer('up'); });
    document.getElementById('btn-down').addEventListener('touchstart', e => { e.preventDefault(); movePlayer('down'); });
    document.getElementById('btn-left').addEventListener('touchstart', e => { e.preventDefault(); movePlayer('left'); });
    document.getElementById('btn-right').addEventListener('touchstart', e => { e.preventDefault(); movePlayer('right'); });

    function checkCollisions() {
        let currentLaneIndex = 13 - player.y;
        let currentLane = lanes[currentLaneIndex];

        if (currentLane && currentLane.type === 'road') {
            let playerLeft = player.x * stepX;
            let playerRight = playerLeft + stepX;

            for (let i = 0; i < currentLane.obstacles.length; i++) {
                let obs = currentLane.obstacles[i];
                let obsLeft = obs.x;
                let obsRight = obs.x + obs.width;

                if (playerRight > obsLeft + 5 && playerLeft < obsRight - 5) {
                    gameOver();
                    return;
                }
            }
        }
    }

    function gameOver() {
        gameActive = false;
        document.getElementById('final-score').innerText = score;
        showScreen('gameover-screen');
    }

    function animate() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < lanes.length; i++) {
            let renderYPos = (13 - i) * stepY;
            if (renderYPos > -stepY && renderYPos < canvas.height + stepY) {
                lanes[i].update();
                lanes[i].draw(renderYPos);
            }
        }

        const playerCenterX = (player.x * stepX) + (stepX / 2);
        const playerCenterY = ((13 - player.y) * stepY) + (stepY / 2);

        ctx.save();
        ctx.font = `${Math.floor(stepY * 0.9)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla","Arial"`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.fillText(selectedEmoji, playerCenterX, playerCenterY);
        ctx.restore();

        checkCollisions();
        requestAnimationFrame(animate);
    }

    showScreen('menu-screen');
</script>
</body>
</html>
