<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Raiders - Crimson Edition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        h1 {
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 2px 0;
            font-size: 16px;
        }
        .menu-screen {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #8b0000;
            text-align: center;
            box-shadow: 0 2px 10px rgba(255, 0, 0, 0.25);
            max-width: 260px;
            width: 100%;
        }
        .game-wrapper {
            position: relative;
            display: none;
            background-color: #1e1e1e;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #8b0000;
            box-shadow: 0 2px 10px rgba(255, 0, 0, 0.25);
        }
        canvas {
            background-color: #000000;
            border: 1px solid #444444;
            display: block;
            width: 240px;
            height: 320px;
        }
        .hud-element {
            position: absolute;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            color: #a0a0a0;
            background: rgba(18, 18, 18, 0.8);
            padding: 2px 5px;
            border-radius: 3px;
        }
        #score-hud { top: 12px; left: 12px; color: #ff3333; }
        #round-hud { top: 12px; right: 12px; color: #00ff66; display: none; }
        
        button {
            background-color: #8b0000;
            color: white;
            border: 1px solid #ff3333;
            padding: 8px 15px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            margin: 10px 0;
            width: 100%;
        }
        button:hover {
            background-color: #ff3333;
            box-shadow: 0 0 8px rgba(255, 51, 51, 0.5);
        }
        .toggle-container {
            margin: 10px 0;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .toggle-container input {
            cursor: pointer;
            accent-color: #ff3333;
        }

        /* Mobile Layout Adjustments */
        .mobile-controls {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 256px;
            margin-top: 8px;
            box-sizing: border-box;
        }
        .move-pad {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .ctrl-btn {
            background-color: #1e1e1e;
            color: #ff3333;
            border: 1px solid #8b0000;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 0;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 0 #5a0000;
        }
        .ctrl-btn:active {
            background-color: #8b0000;
            color: white;
            transform: translateY(2px);
            box-shadow: none;
        }
        .fire-btn {
            background-color: #2a0000;
            border-color: #ff3333;
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>Space Raiders</h1>

    <!-- Start Menu Screen -->
    <div id="menu" class="menu-screen">
        <p style="font-size:12px; color:#a0a0a0; margin-bottom:15px;">Defend the base from the incoming fleet.</p>
        <div class="toggle-container">
            <input type="checkbox" id="rounds-toggle" checked>
            <label for="rounds-toggle">Enable Rounds Mode</label>
        </div>
        <button onclick="startGame()">Launch Game</button>
    </div>

    <!-- Active Arena View -->
    <div id="game-container" class="game-wrapper">
        <div id="score-hud" class="hud-element">Score: <span id="score-val">0</span></div>
        <div id="round-hud" class="hud-element">Round: <span id="round-val">1</span></div>
        <canvas id="gameCanvas" width="240" height="320"></canvas>
    </div>

    <!-- Compact Mobile Buttons -->
    <div id="mobile-controls" class="mobile-controls">
        <div class="move-pad">
            <div class="ctrl-btn" onpointerdown="setMove(-1)" onpointerup="setMove(0)" onpointerleave="setMove(0)">←</div>
            <div class="ctrl-btn" onpointerdown="setMove(1)" onpointerup="setMove(0)" onpointerleave="setMove(0)">→</div>
        </div>
        <div class="ctrl-btn fire-btn" onpointerdown="fireLaser()">Fire</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Engine Configurations
    let score = 0;
    let currentRound = 1;
    let roundsEnabled = false;
    let isGameRunning = false;

    // Game Entities
    const player = { x: 110, y: 295, width: 20, height: 12, speed: 3.5, dx: 0 };
    let lasers = [];
    let raiders = [];
    let raiderDirection = 1;
    let raiderSpeed = 0.5;

    // Setup Grid Matrix for Raiders
    function initRaiders() {
        raiders = [];
        const rows = 3;
        const cols = 5;
        const spacingX = 30;
        const spacingY = 20;
        const startX = 25;
        const startY = 45;

        // Scale speeds if Rounds Mode configuration increases the counter
        let speedMultiplier = roundsEnabled ? 1 + (currentRound - 1) * 0.25 : 1;
        raiderSpeed = 0.4 * speedMultiplier;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                raiders.push({
                    x: startX + c * spacingX,
                    y: startY + r * spacingY,
                    width: 16,
                    height: 12,
                    points: (3 - r) * 10
                });
            }
        }
    }

    // Toggle Screens and UI Framework Elements
    function startGame() {
        roundsEnabled = document.getElementById('rounds-toggle').checked;
        score = 0;
        currentRound = 1;
        lasers = [];
        player.x = 110;
        player.dx = 0;

        document.getElementById('score-val').innerText = score;
        document.getElementById('round-val').innerText = currentRound;
        document.getElementById('round-hud').style.display = roundsEnabled ? 'block' : 'none';

        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        
        // Show mobile triggers only if a touch-enabled viewport is detected
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('mobile-controls').style.display = 'grid';
        }

        initRaiders();
        isGameRunning = true;
        requestAnimationFrame(updateLoop);
    }

    // Controller Input Processing
    function setMove(dir) {
        player.dx = dir * player.speed;
    }

    function fireLaser() {
        if (!isGameRunning || lasers.length >= 3) return; // Cap maximum shots on screen
        lasers.push({ x: player.x + player.width / 2 - 1, y: player.y, width: 2, height: 6, speed: 5 });
    }

    // Capture Keyboard Keys
    document.addEventListener('keydown', (e) => {
        if (!isGameRunning) return;
        if (e.key === 'ArrowLeft' || e.key === 'a') setMove(-1);
        if (e.key === 'ArrowRight' || e.key === 'd') setMove(1);
        if (e.key === ' ' || e.key === 'ArrowUp') fireLaser();
    });

    document.addEventListener('keyup', (e) => {
        if (!isGameRunning) return;
        if (['ArrowLeft', 'a', 'ArrowRight', 'd'].includes(e.key)) setMove(0);
    });

    // Main Engine Compute Cycle
    function updateLoop() {
        if (!isGameRunning) return;

        // Clear Arena Canvas
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Move Player Boundary Checks
        player.x += player.dx;
        if (player.x < 0) player.x = 0;
        if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

        // Render Ship Vector Design
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillRect(player.x + 8, player.y - 4, 4, 4); // Turret tip

        // Update Laser Positions
        for (let i = lasers.length - 1; i >= 0; i--) {
            lasers[i].y -= lasers[i].speed;
            if (lasers[i].y < 0) {
                lasers.splice(i, 1);
                continue;
            }

            // Draw Beam
            ctx.fillStyle = '#ff1a1a';
            ctx.fillRect(lasers[i].x, lasers[i].y, lasers[i].width, lasers[i].height);
        }

        // Handle Raider Fleet Shifts
        let dropDown = false;
        raiders.forEach(raider => {
            raider.x += raiderSpeed * raiderDirection;
            if (raider.x <= 0 || raider.x >= canvas.width - raider.width) {
                dropDown = true;
            }
        });

        if (dropDown) {
            raiderDirection *= -1;
            raiders.forEach(raider => {
                raider.y += 8;
                // Defeat check if invaders touch base level perimeter bounds
                if (raider.y + raider.height >= player.y) {
                    endGame(false);
                }
            });
        }

        // Collision Check Logic: Beam intersects Enemy bounding box array
        for (let l = lasers.length - 1; l >= 0; l--) {
            for (let r = raiders.length - 1; r >= 0; r--) {
                if (lasers[l] && 
                    lasers[l].x > raiders[r].x && 
                    lasers[l].x < raiders[r].x + raiders[r].width &&
                    lasers[l].y > raiders[r].y && 
                    lasers[l].y < raiders[r].y + raiders[r].height) {
                    
                    score += raiders[r].points;
                    document.getElementById('score-val').innerText = score;
                    raiders.splice(r, 1);
                    lasers.splice(l, 1);
                    break;
                }
            }
        }

        // Render Raider Sprites
        raiders.forEach(raider => {
            ctx.fillStyle = '#8b0000';
            ctx.fillRect(raider.x, raider.y, raider.width, raider.height);
            // Draw invader eyes
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(raider.x + 3, raider.y + 3, 2, 2);
            ctx.fillRect(raider.x + 11, raider.y + 3, 2, 2);
        });

        // Round Win Progression Matrix Checking
        if (raiders.length === 0) {
            if (roundsEnabled) {
                currentRound++;
                document.getElementById('round-val').innerText = currentRound;
                initRaiders();
            } else {
                endGame(true);
            }
        }

        if (isGameRunning) requestAnimationFrame(updateLoop);
    }

    function endGame(victory) {
        isGameRunning = false;
        alert(victory ? `Victory achieved! Final Score: ${score}` : `Game Over! You made it to Round ${currentRound}. Score: ${score}`);
        
        // Return Layout states cleanly back to starting menu index pages
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('mobile-controls').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
    }
</script>
</body>
</html>
