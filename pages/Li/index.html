<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jayden Li Clicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark;--bg:#050505;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--bh:rgba(255,255,255,.18);--tx:#fff;--mu:rgba(255,255,255,.45);--n:#6aa6ff;--p:#7be0a4;--i:#f0a35e;--c:var(--n);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Outfit','Trebuchet MS',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.22;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--n);top:-20vmax;left:-15vmax}
.aurora i:nth-child(2){background:var(--p);bottom:-25vmax;right:-15vmax;animation-duration:28s;animation-delay:-8s}
.aurora i:nth-child(3){background:var(--i);top:30%;left:45%;opacity:.12;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:48px 1.25rem 3rem}
.hero{text-align:center;position:relative}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:999px;padding:.3rem .9rem;font-size:.78rem;font-weight:500;color:var(--mu);margin-bottom:1.2rem;animation:up .7s ease .2s both}
.badge b{width:6px;height:6px;border-radius:50%;background:var(--p);box-shadow:0 0 8px var(--p)}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(3.5rem,13vw,7rem);line-height:.9;letter-spacing:.02em;animation:up .8s ease .35s both}
h1 span{display:block}
h1 span:first-child{background:linear-gradient(90deg,#fff 0%,#6aa6ff 35%,#7be0a4 55%,#f0a35e 75%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
h1 .ghost{color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.22)}
@keyframes shine{to{background-position:-250% 0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.news{margin:1rem auto 0;color:var(--mu);font-weight:300;max-width:520px;min-height:1.6em;animation:up .8s ease .5s both}
.divider{height:1px;background:var(--border);margin:1.5rem 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem}
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--c);box-shadow:0 0 14px var(--c)}
.stat b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:2.2rem;letter-spacing:.04em;color:var(--c);text-shadow:0 0 20px color-mix(in srgb,var(--c) 55%,transparent);overflow-wrap:anywhere}
.stat span{color:var(--mu);font-size:.78rem}
#s1{--c:var(--n)}#s2{--c:var(--p)}#s3{--c:var(--i)}
.stage{position:relative;display:flex;justify-content:center;margin:1.5rem 0 .5rem}
.stage::before{content:'';position:absolute;width:420px;height:420px;max-width:100%;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(106,166,255,.16) 0%,transparent 70%);animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{opacity:.6;transform:translate(-50%,-50%) scale(1.12)}}
#big{position:relative;width:min(320px,74vw);height:min(320px,74vw);display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:50%;cursor:pointer;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;backdrop-filter:none}
#big::before{content:'';position:absolute;inset:6%;border-radius:50%;border:1px solid var(--bh);box-shadow:0 0 40px -6px var(--n),inset 0 0 40px -14px var(--n);animation:ring 3s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.04);border-color:var(--n)}}
#big img{position:relative;max-width:82%;max-height:82%;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6)) drop-shadow(0 0 16px rgba(106,166,255,.3))}
#big.hit img{animation:hit .14s}
@keyframes hit{50%{transform:scale(.88) rotate(-4deg)}}
.row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:2rem;letter-spacing:.03em;text-align:center;margin:2.2rem 0 1rem}
button{position:relative;overflow:hidden;font:inherit;color:var(--tx);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem 1.2rem;cursor:pointer;text-align:left;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .25s,background .25s,transform .2s}
button::after{content:'';position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.1),transparent 70%);opacity:0;transition:opacity .25s;pointer-events:none}
button:hover:not(:disabled)::after{opacity:1}
button:hover:not(:disabled){border-color:var(--bh);background:rgba(255,255,255,.06);transform:translateY(-3px)}
button:focus-visible{outline:2px solid rgba(255,255,255,.6);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.can{border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 22px -8px var(--c);animation:ready 2s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 30px -2px var(--c);border-color:var(--c)}}
button.bump{animation:bump .25s ease-out}
@keyframes bump{50%{transform:scale(.95)}}
.nm{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.4rem;letter-spacing:.04em}
.lv{color:var(--mu);font-size:.9rem}
small{display:block;color:var(--mu);font-weight:300;font-size:.82rem;line-height:1.5;margin-top:.2rem}
.bar{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:.7rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.hide{display:none!important}
.up{--c:var(--p)}.bd{--c:var(--n)}
.maxbtn{display:inline-flex;align-items:center;gap:.8rem;border-radius:999px;padding:.5rem 1.2rem}
.maxbtn .lbl{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.4rem;letter-spacing:.08em}
.track{position:relative;width:48px;height:26px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--border);transition:.25s}
.track::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;opacity:.6;transition:.25s}
.maxbtn[aria-pressed=true]{border-color:var(--n);box-shadow:0 0 26px -4px var(--n)}
.maxbtn[aria-pressed=true] .track{background:var(--n);border-color:var(--n)}
.maxbtn[aria-pressed=true] .track::after{transform:translateX(22px);opacity:1}
.tool{text-align:center;padding:.7rem 1.1rem}
#status{color:rgba(255,255,255,.2);font-size:.8rem;margin-top:1rem;text-align:center}
.fp{position:fixed;pointer-events:none;z-index:5;font-family:'Bebas Neue',Impact,sans-serif;font-size:1.7rem;color:var(--n);text-shadow:0 0 14px var(--n);animation:fp .9s ease-out forwards}
@keyframes fp{to{transform:translateY(-60px);opacity:0}}
.spark{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:5;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.wave{position:fixed;top:50%;left:50%;width:40px;height:40px;margin:-20px;border:2px solid var(--c);border-radius:50%;box-shadow:0 0 30px var(--c);pointer-events:none;z-index:6;animation:wv 1s ease-out forwards}
@keyframes wv{to{transform:scale(60);opacity:0}}
.flash{position:fixed;inset:0;background:var(--c);opacity:.18;pointer-events:none;z-index:6;animation:fl .6s ease-out forwards}
@keyframes fl{to{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="aurora"><i></i><i></i><i></i></div>
<svg id="stars" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
<div class="page">
<section class="hero">
<div class="badge"><b></b>Idle game</div>
<h1><span>Jayden Li</span><span class="ghost">Clicker</span></h1>
<p class="news" id="news">Jayden Li has entered the chat.</p>
</section>
<div class="divider"></div>
<div class="stats">
<div class="stat" id="s1"><b id="n">0</b><span>Jaydens</span></div>
<div class="stat" id="s2"><b id="cps">0</b><span>Per second</span></div>
<div class="stat" id="s3"><b id="cv">1</b><span>Per click</span></div>
</div>
<div class="stage"><button id="big" aria-label="Click Jayden"><img id="face" alt=""></button></div>
<div class="row"><button id="maxbtn" class="maxbtn" aria-pressed="false"><span class="lbl">Buy max</span><span class="track"></span></button></div>
<h2 id="h-u" class="hide">Upgrades</h2>
<div class="grid" id="g-u"></div>
<h2>The Li family</h2>
<div class="grid" id="g-b"></div>
<div class="row" style="margin-top:2rem"><button class="tool" id="save">Save now</button><button class="tool" id="reset">Reset</button></div>
<div id="status"></div>
</div>

(function(){const svg=document.getElementById('stars'),W=innerWidth,H=innerHeight,NS='http://www.w3.org/2000/svg';svg.setAttribute('viewBox','0 0 '+W+' '+H);
for(let i=0;i<140;i++){const op=Math.random()*.4+.06,c=document.createElementNS(NS,'circle'),a=document.createElementNS(NS,'animate');
c.setAttribute('cx',Math.random()*W);c.setAttribute('cy',Math.random()*H);c.setAttribute('r',Math.random()+.15);c.setAttribute('fill','white');c.setAttribute('opacity',op);
a.setAttribute('attributeName','opacity');a.setAttribute('values',op+';'+(op*.12).toFixed(3)+';'+op);a.setAttribute('dur',(Math.random()*5+2).toFixed(1)+'s');a.setAttribute('begin',(Math.random()*8).toFixed(1)+'s');a.setAttribute('repeatCount','indefinite');c.appendChild(a);svg.appendChild(c)}})();
const SUF=["","K","M","B","T","Qd","Qn","Sx","Sp","Oc","No","Dc"];
function fmt(x){if(!isFinite(x))return"Infinity";if(x<1000)return String(+x.toFixed(x<10?1:0));const k=Math.floor(Math.log10(x)/3);if(k>=SUF.length)return x.toExponential(2);return(x/Math.pow(10,3*k)).toFixed(2)+SUF[k]}
const B=[["🖱️","Cursor Li",15,.1],["👵","Auntie Li",100,1],["🌾","Farmer Li",1100,8],["⛏️","Miner Li",12000,47],["🏭","Boss Li",130000,260],["🏦","Banker Li",1.4e6,1400],["⛩️","Monk Li",2e7,7800],["🧙","Wizard Li",3.3e8,44000],["🚀","Astronaut Li",5.1e9,260000],["⚗️","Alchemist Li",7.5e10,1.6e6],["🌀","Portal Li",1e12,1e7],["⏳","Time Traveller Li",1.4e13,6.5e7]];
const TIERS=[[1,10],[5,50],[25,500],[50,5000]];
const UP=[];B.forEach((b,i)=>TIERS.forEach((t,j)=>UP.push({id:i+"_"+j,i,own:t[0],cost:b[2]*t[1],name:b[1]+" x2"})));
const NEWS=["Jayden Li has entered the chat.","Family reunion of Lis causes Jayden shortage.","Every Li in the phone book has joined the grind.","Economists baffled by Jayden inflation.","Census confirms: there are a lot of Lis.","Experts say: more Jaydens.","The Jayden market hits all-time high.","Jayden Li declared a natural resource."];
const fresh=()=>({n:0,t:0,c:0,own:B.map(()=>0),up:{},ts:Date.now()});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem("jlc")||"null");if(s&&s.own&&s.own.length===B.length)S=s}catch(e){}
const $=id=>document.getElementById(id);
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mult=i=>{let m=1;UP.forEach(u=>{if(u.i===i&&S.up[u.id])m*=2});return m};
const cost=i=>Math.ceil(B[i][2]*Math.pow(1.15,S.own[i]));
const cps=()=>B.reduce((a,b,i)=>a+S.own[i]*b[3]*mult(i),0);
const cv=()=>mult(0);
let maxOn=false;
function sparks(x,y,col){if(calm)return;for(let k=0;k<12;k++){const d=document.createElement('div'),a=Math.random()*6.28,r=30+Math.random()*60;d.className='spark';d.style.cssText='left:'+x+'px;top:'+y+'px;--dx:'+Math.cos(a)*r+'px;--dy:'+Math.sin(a)*r+'px;background:'+col+';box-shadow:0 0 8px '+col;document.body.appendChild(d);setTimeout(()=>d.remove(),600)}}
function wave(col){if(calm)return;['wave','flash'].forEach(c=>{const d=document.createElement('div');d.className=c;d.style.setProperty('--c',col);document.body.appendChild(d);setTimeout(()=>d.remove(),1000)})}
document.addEventListener('pointermove',e=>{const b=e.target.closest&&e.target.closest('button');if(b){const r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left)+'px');b.style.setProperty('--my',(e.clientY-r.top)+'px')}});
let idx=0;$("face").src=IMGS[0];
$("big").addEventListener("click",e=>{const v=cv();S.n+=v;S.t+=v;S.c++;idx=(idx+1)%IMGS.length;$("face").src=IMGS[idx];
const big=$("big");big.classList.remove("hit");void big.offsetWidth;big.classList.add("hit");
const r=big.getBoundingClientRect(),x=e.clientX||r.left+r.width/2,y=e.clientY||r.top+r.height/2;
const d=document.createElement('div');d.className='fp';d.textContent='+'+fmt(v);d.style.left=(x-20)+'px';d.style.top=(y-24)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),900);
sparks(x,y,'#6aa6ff');render()});
$("maxbtn").onclick=()=>{maxOn=!maxOn;$("maxbtn").setAttribute("aria-pressed",maxOn)};
const bb=[],ub={};
B.forEach((b,i)=>{const el=document.createElement("button");el.className="bd";el.onclick=()=>{let c=0;while(S.n>=cost(i)){S.n-=cost(i);S.own[i]++;c++;if(!maxOn||c>=500)break}
if(c){bump(el);const r=el.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2,'#6aa6ff')}render()};
$("g-b").appendChild(el);bb.push(el)});
UP.forEach(u=>{const el=document.createElement("button");el.className="up";el.onclick=()=>{if(S.n>=u.cost){S.n-=u.cost;S.up[u.id]=1;const r=el.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2,'#7be0a4');wave('#7be0a4');render()}};$("g-u").appendChild(el);ub[u.id]=el});
function bump(el){if(calm)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function render(){
$("n").textContent=fmt(Math.floor(S.n));$("cps").textContent=fmt(cps());$("cv").textContent=fmt(cv());document.title=fmt(Math.floor(S.n))+" Jaydens";
B.forEach((b,i)=>{const el=bb[i],c=cost(i),can=S.n>=c;el.classList.toggle("hide",!(S.t>=b[2]*.5||S.own[i]>0||i===0));el.classList.toggle("can",can);el.disabled=!can;
el.innerHTML=`<span class="nm">${b[0]} ${b[1]}</span> <span class="lv">(${S.own[i]})</span><small>Makes ${fmt(b[3]*mult(i))}/s each · ${fmt(S.own[i]*b[3]*mult(i))}/s total<br>Cost: ${fmt(c)} Jaydens</small><span class="bar"><i style="width:${Math.min(100,S.n/c*100)}%"></i></span>`});
let any=false;
UP.forEach(u=>{const el=ub[u.id],show=!S.up[u.id]&&S.own[u.i]>=u.own,can=S.n>=u.cost;el.classList.toggle("hide",!show);if(!show)return;any=true;el.classList.toggle("can",can);el.disabled=!can;
el.innerHTML=`<span class="nm">${B[u.i][0]} ${u.name}</span><small>Doubles output${u.i===0?' and click power':''}<br>Cost: ${fmt(u.cost)} Jaydens</small><span class="bar"><i style="width:${Math.min(100,S.n/u.cost*100)}%"></i></span>`});
$("h-u").classList.toggle("hide",!any)}
let last=performance.now();
setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;const g=cps()*dt;S.n+=g;S.t+=g;render()},100);
function save(){try{S.ts=Date.now();localStorage.setItem("jlc",JSON.stringify(S));$("status").textContent="Saved at "+new Date().toLocaleTimeString()}catch(e){$("status").textContent="Saving is unavailable here"}}
setInterval(save,20000);$("save").onclick=save;
$("reset").onclick=()=>{if(confirm("Reset all progress?")){S=fresh();try{localStorage.removeItem("jlc")}catch(e){}render()}};
let ni=0;setInterval(()=>{ni=(ni+1)%NEWS.length;$("news").textContent=NEWS[ni]},6000);
render();
</script></body></html>
