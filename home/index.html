<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    min-height:100vh;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    font-size:2.5rem;
}

#games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
    max-width:1200px;
    margin:auto;
}

.game-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:white;
    background:#2563eb;
    border-radius:12px;
    min-height:70px;
    font-size:1.1rem;
    transition:.2s;
}

.game-btn:hover{
    background:#1d4ed8;
    transform:translateY(-3px);
}

.loading{
    text-align:center;
    font-size:1.2rem;
}
</style>
</head>
<body>

<h1>🎮 Games Hub</h1>

<div id="games">
    <div class="loading">Loading games...</div>
</div>

<script>
async function loadGames() {
    const container = document.getElementById("games");

    try {
        const response = await fetch("../pages.json");

        if (!response.ok) {
            throw new Error("Could not load pages.json");
        }

        const files = await response.json();

        container.innerHTML = "";

        files.sort().forEach(file => {
            const button = document.createElement("a");

            button.href = "../pages/" + file;
            button.className = "game-btn";

            const name = file
                .replace(".html", "")
                .replace(/[-_]/g, " ")
                .replace(/\b\w/g, c => c.toUpperCase());

            button.textContent = name;

            container.appendChild(button);
        });

    } catch (error) {
        container.innerHTML = `
            <div style="color:#f87171;text-align:center;">
                Failed to load pages.json
            </div>
        `;
        console.error(error);
    }
}

loadGames();
</script>

</body>
</html>
